events {}
http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  upstream backend_pool { server backend:8000; }
  server {
    listen 8080;
    location / { proxy_pass http://backend_pool; proxy_connect_timeout 2s; }
    location /nginx-health { access_log off; return 200 "ok\n"; }
  }
}
