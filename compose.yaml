name: linux-troubleshooting-lab
services:
  backend:
    build: ./app
    environment:
      APP_MESSAGE: ${APP_MESSAGE:-Linux troubleshooting lab}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    networks: [labnet]
    read_only: true
    tmpfs: [/tmp:size=16m]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 2s
      retries: 5
  proxy:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${HOST_PORT:-8080}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - lab_logs:/var/log/nginx
    depends_on:
      backend: {condition: service_healthy}
    networks: [labnet]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
  toolbox:
    build: ./toolbox
    networks: [labnet]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  labnet:
    name: linux-troubleshooting-lab-net
    internal: true
volumes:
  lab_logs:
    name: linux-troubleshooting-lab-logs
